# Render Blueprint: the whole platform as ONE web service.
#   /         main site (+ /ru, /uz)
#   /shop     Family Store
#   /studio   Studio app
#   /admin    Snapbell admin
#   /v1       API (runs inside the same service)
#
# Deploy: render.com → New → Blueprint → pick this repository → Apply.
# Free instances sleep after ~15 minutes without traffic; the first visit
# after that takes about a minute. The API keeps data in memory, so demo data
# resets whenever the service restarts.

services:
  - type: web
    name: vinetka
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@10.34.9 && pnpm install --frozen-lockfile --filter "@snapbell/web..." --filter "@snapbell/api..." --filter snapbell && pnpm exec turbo run build --filter=@snapbell/web --filter=@snapbell/api
    startCommand: node scripts/start.mjs
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: TURBO_TELEMETRY_DISABLED
        value: "1"
      # Demo: shows demo logins/codes and returns one-time codes on screen (no SMS provider).
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: INTERNAL_PROXY_SECRET
        generateValue: true
      # One public address for everything.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://vinetka.onrender.com
      - key: NEXT_PUBLIC_STORE_URL
        value: https://vinetka.onrender.com/shop
      - key: NEXT_PUBLIC_STUDIO_URL
        value: https://vinetka.onrender.com/studio
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://vinetka.onrender.com/admin
      - key: NEXT_PUBLIC_API_URL
        value: https://vinetka.onrender.com/v1
      # The website talks to the API inside the service.
      - key: API_URL
        value: http://127.0.0.1:4000/v1
      - key: API_ORIGIN
        value: http://127.0.0.1:4000
      # API settings.
      - key: PUBLIC_API_URL
        value: https://vinetka.onrender.com
      - key: STORE_URL
        value: https://vinetka.onrender.com/shop
      - key: STUDIO_URL
        value: https://vinetka.onrender.com/studio
      - key: WEB_ORIGINS
        value: https://vinetka.onrender.com
