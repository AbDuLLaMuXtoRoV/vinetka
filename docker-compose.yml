# Local infrastructure for the production data path. Not needed for `pnpm dev`:
# the API runs on an in-memory store seeded with demo data when DATABASE_URL is unset.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: snapbell
      POSTGRES_PASSWORD: snapbell
      POSTGRES_DB: snapbell
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
